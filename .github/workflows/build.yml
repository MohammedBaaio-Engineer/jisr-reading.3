name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          if [ -f jisr-app.zip ]; then
            unzip -q -o jisr-app.zip -d unpacked
            cp -r unpacked/jisr-app/. .
          fi
          ls

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Build
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          node scripts/patch-android.mjs
          npx capacitor-assets generate --android || echo "icons skipped"
          npx cap sync android
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../jisr-reading.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: jisr-reading v1.${{ github.run_number }}
          files: jisr-reading.apk
